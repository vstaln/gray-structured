[package]
name = "gray-structured"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "structured tool: runs a host turn constrained to a JSON schema. Port of pi's structured-output extension."

[[bin]]
name = "gray-structured"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
strip = true
